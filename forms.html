<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>some questions about chess!</title>
</head>
<body>
    <nav>
        <a href="index.html">Home</a><br>
        <a href="forms.html">Forms</a><br>
        
    </nav>
    <header>
        <h1><s>lot's of Questions About Chess!</s></h1>
        <h1>Some Questions About Chess!</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <p><u>which color do you prefer more?</u></p><!--this entire chunk of code is a radio form-->

                <b>

                <input type="radio" name="color" id="white">
                <label for="white">White</label><br>
                <input type="radio" name="color" id="black">
                <label for="black">Black</label><br>
                <input type="radio" name="color" id="both">
                <label for="both">Both</label><br><br>

                </b>
                <i>

                

                
                    <label for="chess-select"><b>Which chess piece is your favorite?</b></label><!--this entire chunk of code is a select form-->
                    <select name="chess-select" id="chess-select">
                        <option value="king">King</option>
                        <option value="queen">Queen</option>
                        <option value="rook">Rook</option>
                        <option value="bishop">Bishop</option>
                        <option value="knight">Knight</option>
                        <option value="pawn">Pawn</option>
                        
                    </select>

                

                </i>
                <br><br>

                <label for="opening"><i>What is your favorite opening?</i></label><br><!--this entire chunk of code is a text area form-->

                <textarea id="opening" name="opening" rows="2" cols="50"></textarea><br><br>

                <input type="submit" value="Submit">

                
            </fieldset>
        </form>
        <form>
            <fieldset>
                <legend>here are some other inputs to play around with</legend><!--this entire chunk of code is a color and range form to play around with-->

                
                <input type="color" name="colour"><br><br>
                <input type="range" name="scale" min="1" max="10" value="5"><br><br>


            </fieldset>
        </form>
    </main>
</body>
</html>
